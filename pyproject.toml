[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic in strings is intended

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true
