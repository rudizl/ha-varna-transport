name: Release

# Push a tag like v0.3.0 to publish a GitHub release. HACS then shows the
# version and these notes as an update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/varna_transport/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '
            $0 == v {on=1; next}
            /^## / && on {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section '## $version' in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
