name: Release

# Publish a release for tag vX.Y.Z, either by pushing the tag or from the
# GitHub web UI (Releases > Draft a new release). The notes come from the
# matching CHANGELOG.md section. HACS then shows the version as an update.
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  release:
    types: [published]

permissions:
  contents: write

# Tags with or without a leading v (v0.4.0 or 0.4.0).
env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

# A release made in the web UI fires both the tag push and the release
# event; let only one of them run.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match manifest version
        run: |
          tag="${TAG#v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/varna_transport/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $TAG does not match manifest version $manifest"
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="## $version" '
            $0 == v {on=1; next}
            /^## / && on {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section '## $version' in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made in the web UI already exists: only fill in its notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
